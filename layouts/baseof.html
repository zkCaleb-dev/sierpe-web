<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }} — a self-hosted Stellar indexer{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ site.Params.description }}">
  {{ with resources.Get "css/main.css" | minify }}
  <link rel="stylesheet" href="{{ .RelPermalink }}">
  {{ end }}
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <header id="topbar">
    <div class="wrap">
      <a id="logo" href="/">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M4 17c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3v-2c-2.5 0-2.5 3-5 3s-2.5-3-5-3-2.5 3-5 3v2zm0-6c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3V6c-2.5 0-2.5 3-5 3S11.5 6 9 6 6.5 9 4 9v2z"/></svg>
        sierpe
      </a>
      <nav>
        {{ range site.Menus.main }}
        <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} class="active"{{ end }}>{{ .Name }}</a>
        {{ end }}
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    <div class="wrap">
      <p>Sierpe {{ site.Params.version }} — Apache-2.0 licensed free software.
      Source on <a href="{{ site.Params.github }}">GitHub</a>.
      Not affiliated with the Stellar Development Foundation.</p>
    </div>
  </footer>
</body>
</html>
