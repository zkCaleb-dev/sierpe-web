baseURL = 'https://sierpe-web.vercel.app/'
locale = 'en-us'
title = 'Sierpe'
disableKinds = ['taxonomy', 'term']

[params]
  description = 'A self-hosted Stellar indexer. Register a contract, get its complete history behind an honest REST API.'
  github = 'https://github.com/zkCaleb-dev/sierpe'
  version = 'v1.5.2'
  released = '2026-08-21'
  image = 'ghcr.io/zkcaleb-dev/sierpe:v1.5.2'

[menus]
  [[menus.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10
  [[menus.main]]
    name = 'News'
    pageRef = '/news'
    weight = 20
  [[menus.main]]
    name = 'Docs'
    pageRef = '/docs'
    weight = 30
  [[menus.main]]
    name = 'Why Sierpe'
    pageRef = '/why-sierpe'
    weight = 40
  [[menus.main]]
    name = 'GitHub'
    url = 'https://github.com/zkCaleb-dev/sierpe'
    weight = 50

# Machine-readable docs for AI assistants (llmstxt.org): /llms.txt is the
# index, /llms-full.txt concatenates every docs page from the SAME source
# files the human pages render from, so it can never drift.
[outputFormats.llms]
  mediaType = 'text/plain'
  baseName = 'llms'
  isPlainText = true

[outputFormats.llmsfull]
  mediaType = 'text/plain'
  baseName = 'llms-full'
  isPlainText = true

[outputs]
  home = ['html', 'rss', 'llms', 'llmsfull']

[markup.highlight]
  style = 'friendly'
  noClasses = true
